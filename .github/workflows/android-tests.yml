name: Android tests

on:
  push:
    branches: ["**"]
  pull_request:

# karoo-ext is hosted on GitHub Packages (hammerheadnav/karoo-ext), which
# requires authentication even for public packages. settings.gradle.kts reads
# GITHUB_ACTOR / GITHUB_TOKEN. The built-in GITHUB_TOKEN works if it can read
# that package; if resolution fails, add repo secrets GPR_USER (a username)
# and GPR_TOKEN (a PAT with read:packages) — they take precedence below.
env:
  GITHUB_ACTOR: ${{ secrets.GPR_USER || github.actor }}
  GITHUB_TOKEN: ${{ secrets.GPR_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  unit-tests:
    name: JVM unit tests (incl. Robolectric)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Robolectric's Android 16 (SDK 36) jar requires Java 21+.
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests with coverage
        run: ./gradlew testDebugUnitTest koverXmlReportDebug koverHtmlReportDebug --stacktrace
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/build/reports/kover/

  instrumented-tests:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace
      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/
