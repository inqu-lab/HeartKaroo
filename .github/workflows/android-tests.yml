name: Android tests

on:
  push:
    branches: ["**"]
  pull_request:

# karoo-ext is hosted on GitHub Packages (hammerheadnav/karoo-ext), which
# requires authentication even for public packages. settings.gradle.kts reads
# GITHUB_ACTOR / GITHUB_TOKEN. The built-in GITHUB_TOKEN works if it can read
# that package; if resolution fails, add repo secrets GPR_USER (a username)
# and GPR_TOKEN (a PAT with read:packages) — they take precedence below.
env:
  GITHUB_ACTOR: ${{ secrets.GPR_USER || github.actor }}
  GITHUB_TOKEN: ${{ secrets.GPR_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  unit-tests:
    name: JVM unit tests (incl. Robolectric)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Robolectric's Android 16 (SDK 36) jar requires Java 21+.
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests with coverage
        run: ./gradlew testDebugUnitTest koverXmlReportDebug koverHtmlReportDebug --stacktrace
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/build/reports/kover/
