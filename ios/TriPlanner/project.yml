# XcodeGen spec — run `xcodegen generate` in this directory to produce
# TriPlanner.xcodeproj, then open it in Xcode.
name: TriPlanner
options:
  bundleIdPrefix: se.inqu
  deploymentTarget:
    iOS: "17.0"
targets:
  TriPlanner:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: TriPlanner
        NSAppTransportSecurity:
          # Allow plain-HTTP backends during local development only.
          NSAllowsLocalNetworking: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
